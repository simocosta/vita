function forecast(){
  const now=new Date(),Y=now.getFullYear(),M=now.getMonth();
  const monthKey=(y,m)=>String(y)+'-'+String(m+1).padStart(2,'0');
  const monthTotal=k=>sum(rows.filter(r=>r.type==='expense'&&r.date&&r.date.startsWith(k)));
  const recurring=rows.filter(r=>r.type==='expense'&&r.recurring);
  const recurringMonthly=sum(recurring);
  const completed=[];
  for(let i=1;i<=12;i++){
    const d=new Date(Y,M-i,1),k=monthKey(d.getFullYear(),d.getMonth()),v=monthTotal(k);
    if(v>0)completed.push(v);
  }
  const recent=completed.slice(0,3);
  const avgRecent=recent.length?sum(recent.map(v=>({amount:v})))/recent.length:0;
  const avgYear=completed.length?sum(completed.map(v=>({amount:v})))/completed.length:0;
  const variableRecent=Math.max(0,avgRecent-recurringMonthly);
  const variableYear=Math.max(0,avgYear-recurringMonthly);
  const currentKey=monthKey(Y,M);
  const currentRows=rows.filter(r=>r.type==='expense'&&r.date&&r.date.startsWith(currentKey)&&r.date<=today());
  const currentActual=sum(currentRows);
  const daysInMonth=new Date(Y,M+1,0).getDate();
  const daysElapsed=new Date().getDate();
  const sameLastYear=[];
  for(let d=1;d<=12;d++){
    const k=monthKey(Y-1,d-1),v=monthTotal(k);
    if(v>0)sameLastYear.push({month:d-1,total:v});
  }
  const sameMonthLastYear=monthTotal(monthKey(Y-1,M));
  const historicalBase=variableRecent*.5+variableYear*.3+Math.max(0,sameMonthLastYear-recurringMonthly)*.2;
  const fallback=Math.max(variableRecent,variableYear);
  const variableForecast=historicalBase||fallback||Math.max(0,avgYear-recurringMonthly);
  const currentProjection=Math.max(currentActual,Math.round(currentActual/Math.max(daysElapsed,1)*daysInMonth));
  const estimate=(y,m)=>{
    const k=monthKey(y,m),actual=monthTotal(k);
    if(y===Y&&m<M)return null;
    if(y===Y&&m===M)return currentProjection;
    const lastYear=monthTotal(monthKey(y-1,m));
    const recurringPart=recurringMonthly;
    let variable=variableForecast;
    if(lastYear>0){
      const lastVariable=Math.max(0,lastYear-recurringPart);
      variable=(variable*.7)+(lastVariable*.3);
    }
    return Math.round(variable+recurringPart);
  };
  const months=[];
  for(let m=M;m<12;m++)months.push({y:Y,m,total:estimate(Y,m)});
  const annualTotal=sum(months.map(x=>({amount:x.total||0})));
  const completedLabel=completed.length?`Media ultimi ${Math.min(completed.length,12)} mesi`: 'Nessuna media storica disponibile';
  return `<h2>Previsioni</h2>
  <div class=card><div class=m>Stima delle spese da ${new Date(Y,M,1).toLocaleDateString('it-IT',{month:'long'})} a dicembre</div><h2 style="margin:0">${eur(annualTotal)}</h2><div class=m>Basata su spese ricorrenti, medie mensili, andamento dei mesi precedenti e confronto con lo stesso mese dell'anno scorso.</div></div>
  ${months.map(x=>{
    const label=new Date(x.y,x.m,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'});
    return `<div class=card><div class=row><b>${label.charAt(0).toUpperCase()+label.slice(1)}</b><b>${eur(x.total)}</b></div></div>`;
  }).join('')}
  <div class=card><div class=m>Fattori considerati</div><div class=row><span>Spese ricorrenti</span><b>${eur(recurringMonthly)}/mese</b></div><div class=row><span>${completedLabel}</span><b>${eur(avgYear)}/mese</b></div>${sameMonthLastYear?`<div class=row><span>Stesso mese anno scorso</span><b>${eur(sameMonthLastYear)}</b></div>`:''}</div>`;
}

function advice(){const out=[],m=monthExp(ym()),p=monthExp(ym(-1)),t=sum(m),pt=sum(p),b=budget(),now=new Date();
const left=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate();
if(pt&&t>pt*(now.getDate()/30)*1.3)out.push(`📈 Stai spendendo più del mese scorso (${eur(t)} contro ${eur(pt)} totali).`);
const cs=a=>a.reduce((o,r)=>(o[r.category]=(o[r.category]||0)+Number(r.amount),o),{}),c1=cs(m),c0=cs(p);
Object.keys(c1).forEach(k=>{if(c0[k]>50&&c1[k]>c0[k]*1.3)out.push(`⚠️ ${k}: già ${eur(c1[k])} (mese scorso ${eur(c0[k])}).`)});
if(b){const r=b-t;out.push(r>=0?`✅ Restano ${eur(r)} di budget: circa ${eur(r/Math.max(left,1))} al giorno.`:`🚨 Budget superato di ${eur(-r)}.`)}else out.push('Imposta un budget mensile per avere consigli più precisi.');
const soon=of('bill').filter(x=>!x.paid&&days(x.date)<=7&&days(x.date)>=0);if(soon.length)out.push(`🔔 Nei prossimi 7 giorni devi pagare ${eur(sum(soon))}: tieni da parte la cifra.`);
const top=Object.entries(c1).sort((a,b)=>b[1]-a[1])[0];if(top)out.push(`🏷️ Categoria più cara: ${top[0]} (${eur(top[1])}).`);
const inc=of('income'),mi=sum(inc.filter(r=>r.date.startsWith(ym()))),sav=sum(inc)-sum(of('expense'));
if(mi){const q=(mi-t)/mi;out.push(q<0?`🚨 Questo mese le spese (${eur(t)}) superano le entrate (${eur(mi)}).`:q<.1?`⚠️ Stai risparmiando solo il ${Math.round(q*100)}% delle entrate del mese: valuta di ridurre le categorie più alte.`:`✅ Questo mese stai risparmiando il ${Math.round(q*100)}% delle entrate (${eur(mi-t)}).`)}else out.push('Inserisci le entrate del mese (scheda Risparmi) per avere consigli sul risparmio.');
const av=Math.max(sum(monthExp(ym(-1))),t);
if(sav>0&&av){const mm=sav/av;out.push(mm<3?`🛟 I risparmi coprono circa ${mm.toFixed(1)} mesi di spese. Prima di investire costruisci un fondo di emergenza di 3-6 mesi su un conto deposito o remunerato, sempre disponibile.`:`📊 I risparmi coprono circa ${mm.toFixed(1)} mesi di spese. Oltre al fondo di emergenza, in base a rischio e orizzonte si considerano di solito titoli di Stato (BTP/BOT), conti deposito, fondi pensione (con vantaggi fiscali) o ETF diversificati a lungo termine. Sono informazioni generali, non consulenza finanziaria: per cifre importanti rivolgiti a un consulente indipendente.`)}
return out}

const COL=['#0a84ff','#2a9d4a','#ff9f0a','#e5383b','#bf5af2','#64d2ff','#ff375f','#8e8e93','#ffd60a','#30d158','#5e5ce6','#ac8e68'];let per='m',cu={y:new Date().getFullYear(),m:new Date().getMonth()};

if(per==='w'){const k=(n.getDay()+6)%7;return[f(Y,M,D-k),f(Y,M,D-k+6)]}

return['0000-01-01','9999-12-31']}

const ms=[...new Set([...inc,...ex].map(r=>r.date.slice(0,7)))].sort().reverse().slice(0,6);
return `<div class=card><div class=row style="gap:6px">${['Simone','Valeria'].map(k=>`<button class=s style="flex:1;padding:9px;${pf===k?'background:var(--a);color:#fff':''}" onclick="pf='${k}';render()">${k}</button>`).join('')}</div></div>`+pbar()+
`<div class=card><b>Riepilogo ${P} · ${plabel()}</b><div class=row><span>Spese</span><b>${eur(e1)}</b></div><div class=row><span>Entrate</span><b>${eur(i1)}</b></div><div class=row><span>Risparmio del periodo</span><b style="color:${col(i1-e1)}">${eur(i1-e1)}</b></div><div class=row><span>Risparmio totale</span><b style="color:${col(T)}">${eur(T)}</b></div><div class=m>Solo voci intestate a ${P}: quelle "Comune" non sono incluse.</div></div>`+charts(P)+
`<div class=card><b>Risparmio mese per mese</b>`+(ms.map(m=>{const a=sum(inc.filter(r=>r.date.startsWith(m))),b=sum(ex.filter(r=>r.date.startsWith(m)));return `<div class=row><span>${m.slice(5)}/${m.slice(0,4)}</span><span class=m>+${eur(a)} −${eur(b)}</span><b style="color:${col(a-b)}">${eur(a-b)}</b></div>`}).join('')||'<span class=m>Nessun dato</span>')+`</div>`}

const ys=per==='cy'?cu.y:per==='y'?new Date().getFullYear():0,mo=(ys?[...Array(12)].map((_,i)=>ys+'-'+String(i+1).padStart(2,'0')):[-5,-4,-3,-2,-1,0].map(o=>ym(o))).map(k=>{return[k.slice(5)+'/'+k.slice(2,4),sum(of('expense').filter(r=>r.date.startsWith(k)&&(!P||(r.who||'Comune')===P)))]}),mx=Math.max(...mo.map(x=>x[1]),1);

return h}
const seg=()=>`<div class=card style="padding:6px"><div class=row style="gap:6px">${[['s','Spese'],['r','Risparmi']].map(([k,l])=>`<button class=s style="flex:1;padding:9px;${sv===k?'background:var(--a);color:#fff':''}" onclick="sv='${k}';render()">${l}</button>`).join('')}</div></div>`;
function rec(t){const a=rows.filter(r=>r.type===t&&r.recurring);return a.length?`<h2>Ricorrenti attive</h2>`+a.map(r=>`<div class=card><div class=row><div>${esc(r.title)} <b>${eur(r.amount)}</b><div class=m>prossima: ${fd(r.date)} · ${esc(r.who||'Comune')}</div></div><div><button class=s onclick="openForm('${r.type}','${r.id}')">✎</button> <button class=s onclick="del('${r.id}')">✕</button></div></div></div>`).join(''):''}
function savings(){const inc=pe('income'),ex=pe('expense'),T=sum(inc)-sum(ex),col=v=>v>=0?'var(--g)':'var(--r)';
const ms=[...new Set([...inc,...ex].map(r=>r.date.slice(0,7)))].sort().reverse().slice(0,12);
return pbar()+`<div class=card><div class=m>Risparmio · ${plabel()} (entrate − spese)</div><h2 style="margin:0;color:${col(T)}">${eur(T)}</h2><div class=m>Entrate ${eur(sum(inc))} · Spese ${eur(sum(ex))}</div></div><div class=card><b>Mese per mese</b>`+(ms.map(m=>{const a=sum(inc.filter(r=>r.date.startsWith(m))),b=sum(ex.filter(r=>r.date.startsWith(m)));return `<div class=row><span>${m.slice(5)}/${m.slice(0,4)}</span><span class=m>+${eur(a)} −${eur(b)}</span><b style="color:${col(a-b)}">${eur(a-b)}</b></div>`}).join('')||'<span class=m>Nessun dato</span>')+`</div>`+rec('income')+'<h2>Ultime entrate</h2>'+inc.slice(0,30).map(r=>`<div class=card><div class=row><div>${esc(r.title)}<div class=m>${fd(r.date)} · ${esc(r.who||'Comune')}${r.recurring?' · 🔁':''}</div></div><div><b>${eur(r.amount)}</b> <button class=s onclick="openForm('income','${r.id}')">✎</button> <button class=s onclick="del('${r.id}')">✕</button></div></div></div>`).join('')}
async function recur(){let ch=false;
for(const r of rows.filter(x=>(x.type==='expense'||x.type==='income')&&x.recurring&&x.date<=today())){let c=r,n=0;
while(c&&c.date<=today()&&n++<24){const{data}=await sb.from('entries').update({recurring:false}).eq('id',c.id).eq('recurring',true).select();if(!data||!data.length)break;
const{data:nx}=await sb.from('entries').insert({type:c.type,title:c.title,amount:c.amount,category:c.category,who:c.who,date:addM(c.date),recurring:true}).select();ch=true;c=nx&&nx[0]}}
return ch}
function openForm(T,id){T=T||{spese:sv==='r'?'income':'expense',scadenze:'bill'}[tab]||'expense';
const r=id?rows.find(x=>x.id===id):{},x=T==='appointment',b=T==='bill',i=T==='income',e=T==='expense',W=['Comune','Simone','Valeria'];
const op=(a,v)=>a.map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('');
dlg.innerHTML=`<h3>${id?'Modifica':'Nuova'} ${{expense:'spesa',income:'entrata',appointment:'appuntamento',bill:'scadenza'}[T]}</h3>`+
(i?`<div class=m>Motivazione</div><select id=f_c>${op(INC,r.category)}</select>`:`<input id=f_t placeholder=Descrizione value="${esc(r.title)}">`)+
(x?'':`<input id=f_a type=number step=0.01 inputmode=decimal placeholder="Importo €" value="${r.amount??''}">`)+
(e?`<select id=f_c>${op(CATS,r.category)}</select>`:'')+
(e||i?`<div class=m>${i?'Ricevuto da':'Speso da'}</div><select id=f_w>${op(W,r.who||'Comune')}</select>`:'')+
(b?`<div class=m>Chi paga</div><select id=f_p>${op(W,r.payer||'Comune')}</select><label><input id=f_l type=checkbox style="width:auto"${r.alt?' checked':''}> Alterna Simone/Valeria ogni mese</label>`:'')+
`<div class=m>Data</div><input id=f_d type=date value="${r.date||today()}">`+(x?`<input id=f_h type=time value="${r.time||''}">`:'')+
(x?'':`<label><input id=f_r type=checkbox style="width:auto"${r.recurring?' checked':''}> Ricorrente ogni mese</label>`)+
`<button class=b onclick="save('${T}','${id||''}')">Salva</button><button class=s onclick="dlg.close()">Annulla</button>`;dlg.showModal()}
async function save(T,id){const g=k=>window[k]?window[k].value:null,t=T==='income'?g('f_c'):(g('f_t')||'').trim();if(!t||!f_d.value)return;
const r={type:T,title:t,date:f_d.value,amount:window.f_a?parseFloat(f_a.value.replace(',','.'))||0:null,category:g('f_c'),who:g('f_w'),payer:g('f_p'),alt:!!(window.f_l&&f_l.checked),time:g('f_h')||null,recurring:!!(window.f_r&&f_r.checked)};
const{error}=await(id?sb.from('entries').update(r).eq('id',id):sb.from('entries').insert(r));if(error){alert('Errore nel salvataggio: '+error.message);return}dlg.close();load()}
async function del(id){if(confirm('Eliminare?')){await sb.from('entries').delete().eq('id',id);load()}}
async function pay(id){const r=rows.find(x=>x.id===id);await sb.from('entries').update({paid:true}).eq('id',id);
if(r.recurring){const o={Simone:'Valeria',Valeria:'Simone'};await sb.from('entries').insert({type:'bill',title:r.title,amount:r.amount,date:addM(r.date),recurring:true,alt:r.alt,payer:r.alt&&o[r.payer]?o[r.payer]:r.payer})}load()}
async function setBudget(){const v=parseFloat((prompt('Budget mensile €')||'').replace(',','.'));if(v>0){await sb.from('entries').insert({type:'budget',title:'Budget',amount:v,date:today()});load()}}
async function askNotif(){const r=await Notification.requestPermission();alert(r==='granted'?'Avvisi attivi: li vedrai all\'apertura dell\'app':'Permesso negato')}
init();
</script><dialog id=dlg></dialog></body></html>
