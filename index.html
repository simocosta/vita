<style>

.year-card .arrow{font-size:22px;color:var(--m)}

</style></head><body><main id="app"></main>

<script>
const SB_URL='https://tabopmarqhonvzrispwz.supabase.co',SB_KEY='sb_publishable_iXFiDuQsMqW4JUj6SeScSw_QbVVJsrb';
const sb=supabase.createClient(SB_URL,SB_KEY);
const CATS=['Casa','Spesa','Ristoranti','Cibo asporto','Trasporti','Salute','Svago','Sport','Utenze','Abbonamenti','Altro'];
let rows=[],tab='spese',sv='s',pf='Simone',profileView='expense',timeMode='m',selectedMonth=new Date().toISOString().slice(0,7),yearPage=null,forecastView='next';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);

const fd=s=>new Date(s+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
const days=s=>Math.round((new Date(s+'T12:00')-new Date(today()+'T12:00'))/864e5);

const addM=x=>{const d=new Date(x+'T12:00'),k=d.getDate();d.setDate(1);d.setMonth(d.getMonth()+1);d.setDate(Math.min(k,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return iso(d)};
const sum=a=>a.reduce((s,r)=>s+Number(r.amount||0),0);
const monthExp=m=>of('expense').filter(r=>r.date.startsWith(m));
const budget=()=>Number(of('budget').sort((a,b)=>b.created_at>a.created_at?1:-1)[0]?.amount||0);

async function init(){const{data}=await sb.auth.getSession();data.session?start():login()}
function login(msg=''){app.innerHTML=`<h2>Casa 🏠</h2><div class=card><input id=e type=email placeholder=Email autocomplete=username><input id=p type=password placeholder=Password autocomplete=current-password><button class=b onclick=doLogin()>Accedi</button><p class=m>${msg}</p></div>`}
async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:e.value.trim().toLowerCase(),password:p.value});error?login('Errore: '+error.message):start()}
async function start(){await load();sb.channel('e').on('postgres_changes',{event:'*',schema:'public',table:'entries'},load).subscribe();
document.addEventListener('visibilitychange',()=>!document.hidden&&load());
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')}
async function load(){const{data}=await sb.from('entries').select('*').order('date',{ascending:false});rows=data||[];if(await recur())return load();render();push()}

function dueSoon(){return of('bill').filter(b=>!b.paid&&days(b.date)<=3).sort((a,b)=>a.date>b.date?1:-1)}
async function push(){const d=dueSoon();if(!d.length||!('Notification'in window)||Notification.permission!=='granted')return;
if(localStorage.ln===today())return;localStorage.ln=today();
const r=await navigator.serviceWorker.ready;r.showNotification('Pagamenti in scadenza',{body:d.map(b=>`${b.title} ${eur(b.amount)}`).join(', ')})}

function render(){
  const tabs=[['spese','💶 Spese'],['profili','👤 Profili'],['scadenze','🔔 Scadenze e previsioni']];
  let h='';
  if(tab==='spese') h=seg()+(sv==='r'?savings():expenseHome());
  if(tab==='profili') h=profile();
  if(tab==='scadenze') h=forecastPage();
  if(yearPage) h=yearExpenses(yearPage);
  app.innerHTML=`<div id="top"></div>${h}${tab==='profili'||yearPage?'':'<button class=fab onclick=openForm()>+</button>'}<nav>${tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';yearPage=null;render()">${l}</button>`).join('')}</nav>`;
}
function expenseHome(){
  const y=String(new Date().getFullYear()),m=monthExp(ym()),t=sum(m),b=budget();
  let h=periodSelector();
  h+=`<div class=card><div class=m>Speso nel periodo</div><h2 style="margin:0">${eur(sum(pe('expense')))}</h2>${b?`<div class=bar><i style="width:${Math.min(100,t/b*100)}%"></i></div><div class=m>Budget ${eur(b)} · restano ${eur(b-t)}</div>`:''}<button class=s onclick=setBudget()>Imposta budget</button></div>`;
  h+=charts()+rec('expense');
  h+=`<details class="card accordion"><summary>Archivio spese ${y}</summary><div class="card year-card" onclick="yearPage=${y};render()"><div class=row><div><b>Spese ${y}</b><div class=m>${eur(sum(of('expense').filter(r=>r.date.startsWith(y+'-'))))} · visualizza tutte le spese dell'anno</div></div><span class=arrow>›</span></div></div></details>`;
  h+=`<h2>Spese · ${plabel()}</h2>`+pe('expense').slice(0,60).map(r=>`<div class=card><div class=row><div>${esc(r.title)}<div class=m>${fd(r.date)} · ${esc(r.category)} · ${esc(r.who||'Comune')}${r.recurring?' · 🔁':''}</div></div><div><b>${eur(r.amount)}</b> <button class=s onclick="openForm('${r.type}','${r.id}')">✎</button> <button class=s onclick="del('${r.id}')">✕</button></div></div></div>`).join('');
  return h;
}
function yearExpenses(y){
  const all=of('expense').filter(r=>r.date.startsWith(y+'-'));
  let h=`<div class=card><button class=s onclick="yearPage=null;render()">‹ Torna alle spese</button><h2 style="margin:4px 0">Spese ${y}</h2><div class=m>${all.length} spese · ${eur(sum(all))}</div></div>`;
  for(let i=0;i<12;i++){
    const key=y+'-'+String(i+1).padStart(2,'0'),a=all.filter(r=>r.date.startsWith(key));
    if(!a.length) continue;
    h+=`<div class=month-block><div class=month-title>${new Date(y,i,1).toLocaleDateString('it-IT',{month:'long',year:'numeric'})} · ${eur(sum(a))}</div>`;
    h+=a.map(r=>`<div class=card><div class=row><div>${esc(r.title)}<div class=m>${fd(r.date)} · ${esc(r.category)} · ${esc(r.who||'Comune')}</div></div><div><b>${eur(r.amount)}</b> <button class=s onclick="openForm('${r.type}','${r.id}')">✎</button><button class=s onclick="del('${r.id}')">✕</button></div></div></div>`).join('');
    h+='</div>';
  }
  return h||`<div class=card>Nessuna spesa nel ${y}.</div>`;
}
function periodSelector(){
  const d=new Date(selectedMonth+'-01T12:00'),label=d.toLocaleDateString('it-IT',{month:'long',year:'numeric'});
  return `<div class=card><div class=subtabs>${[['w','Settimana'],['m','Mese'],['y','Anno']].map(([k,l])=>`<button class="${timeMode===k?'on':''}" onclick="timeMode='${k}';per='${k}';render()">${l}</button>`).join('')}</div>
  ${timeMode==='m'?`<div class=row style="margin-top:6px"><button class=s onclick="stepSelected(-1)">‹</button><b>${label}</b><button class=s onclick="stepSelected(1)">›</button></div>`:''}
  ${timeMode==='y'?`<div class=row style="margin-top:6px"><button class=s onclick="stepSelected(-1)">‹</button><b>${d.getFullYear()}</b><button class=s onclick="stepSelected(1)">›</button></div>`:''}
  ${timeMode==='w'?`<div class=m style="text-align:center;margin-top:6px">${plabel()}</div>`:''}</div>`;
}
function stepSelected(delta){
  const d=new Date(selectedMonth+'-01T12:00');
  if(timeMode==='m') d.setMonth(d.getMonth()+delta); else d.setFullYear(d.getFullYear()+delta);
  selectedMonth=iso(d).slice(0,7); render();
}

function advice(){
  const out=[],m=monthExp(ym()),p=monthExp(ym(-1)),t=sum(m),pt=sum(p),b=budget(),now=new Date();
  if(pt&&t>pt*(now.getDate()/30)*1.3)out.push(`Stai spendendo più del mese scorso (${eur(t)} contro ${eur(pt)} totali).`);
  if(b){const left=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate(),r=b-t;out.push(r>=0?`Restano ${eur(r)} di budget: circa ${eur(r/Math.max(left,1))} al giorno.`:`Budget superato di ${eur(-r)}.`)}
  return out;
}

const COL=['#0a84ff','#2a9d4a','#ff9f0a','#e5383b','#bf5af2','#64d2ff','#ff375f','#8e8e93','#ffd60a','#30d158','#5e5ce6','#ac8e68'];let per='m',cu={y:new Date().getFullYear(),m:new Date().getMonth()};
const PL={w:'Questa settimana',m:'Questo mese',y:'Questo anno'};
function range(){
  const n=new Date(),Y=n.getFullYear(),M=n.getMonth(),D=n.getDate(),f=(y,m,d)=>iso(new Date(y,m,d,12));
  if(per==='w'){const k=(n.getDay()+6)%7;return[f(Y,M,D-k),f(Y,M,D-k+6)]}
  if(per==='m'){const d=new Date(selectedMonth+'-01T12:00');return[iso(d),iso(new Date(d.getFullYear(),d.getMonth()+1,0,12))]}
  if(per==='y'){const y=Number(selectedMonth.slice(0,4));return[f(y,0,1),f(y,11,31)]}
  return['0000-01-01','9999-12-31'];
}
const inPer=r=>r.date>=range()[0]&&r.date<=range()[1];
const pe=t=>rows.filter(r=>r.type===t&&inPer(r)&&(r.date<=today()||range()[0]>today()));
const plabel=()=>timeMode==='m'?new Date(selectedMonth+'-01T12:00').toLocaleDateString('it-IT',{month:'long',year:'numeric'}):timeMode==='y'?selectedMonth.slice(0,4):PL.w;
function profile(){
  const P=pf,w=r=>(r.who||'Comune')===P, common=r=>(r.who||'Comune')==='Comune';
  const exMine=pe('expense').filter(w),exCommon=pe('expense').filter(common),inc=pe('income').filter(w);
  const personalExpense=sum(exMine),commonShare=sum(exCommon)/2,totalExpense=personalExpense+commonShare,saving=sum(inc)-totalExpense;
  const allMine=of('expense').filter(w),allCommon=of('expense').filter(common),allInc=of('income').filter(w);
  const totalSaving=sum(allInc)-sum(allMine)-sum(allCommon)/2,col=v=>v>=0?'var(--g)':'var(--r)';
  let h=`<div class=card><div class=subtabs>${['Simone','Valeria'].map(k=>`<button class="${pf===k?'on':''}" onclick="pf='${k}';render()">${k}</button>`).join('')}</div></div>`;
  h+=periodSelector()+`<div class=card><div class=subtabs>${[['expense','Spese'],['saving','Risparmi']].map(([k,l])=>`<button class="${profileView===k?'on':''}" onclick="profileView='${k}';render()">${l}</button>`).join('')}</div></div>`;
  if(profileView==='expense'){
    h+=`<div class=card><b>Spese di ${P} · ${plabel()}</b><div class=row><span>Spese personali</span><b>${eur(personalExpense)}</b></div><div class=row><span>Spese comuni</span><b>${eur(commonShare)}</b></div><div class=m>Quota personale = Spese comuni totali ÷ 2.</div><div class=row><span>Totale spese</span><b>${eur(totalExpense)}</b></div></div>${charts(P)}`;
  }else{
    h+=`<div class=card><div class=m>Risparmio di ${P} · ${plabel()}</div><h2 style="margin:0;color:${col(saving)}">${eur(saving)}</h2><div class=m>Entrate ${eur(sum(inc))} · Spese ${eur(totalExpense)}</div></div><div class=card><b>Risparmio mese per mese</b>${profileMonths(P)}</div><div class=card><b>Risparmio totale</b><h2 style="margin:4px 0;color:${col(totalSaving)}">${eur(totalSaving)}</h2><div class=m>Entrate personali − spese personali − metà delle spese comuni.</div></div>`;
  }
  return h;
}
function profileMonths(P){
  const months=[...new Set([...of('expense'),...of('income')].map(r=>r.date.slice(0,7)))].sort().reverse().slice(0,12);
  return months.map(m=>{const i=sum(of('income').filter(r=>r.who===P&&r.date.startsWith(m))),o=sum(of('expense').filter(r=>r.who===P&&r.date.startsWith(m))),c=sum(of('expense').filter(r=>(r.who||'Comune')==='Comune'&&r.date.startsWith(m)))/2;return `<div class=row><span>${new Date(m+'-01T12:00').toLocaleDateString('it-IT',{month:'short',year:'numeric'})}</span><span class=m>+${eur(i)} · −${eur(o+c)}</span><b>${eur(i-o-c)}</b></div>`}).join('')||'<span class=m>Nessun dato</span>';
}
function charts(P){

const ex=pe('expense').filter(r=>!P||(r.who||'Comune')===P),t=sum(ex);
const grp=(k,d)=>Object.entries(ex.reduce((o,r)=>{const x=r[k]||d;o[x]=(o[x]||0)+Number(r.amount);return o},{})).sort((a,b)=>b[1]-a[1]);
const cats=grp('category','Altro'),whos=grp('who','Comune');
let h='';
if(!t)return h+'<div class=card><span class=m>Nessuna spesa nel periodo</span></div>';
let off=0;const donut=cats.map(([k,v],i)=>{const l=v/t*251.33,c=`<circle r=40 cx=60 cy=60 fill=none stroke="${COL[i%COL.length]}" stroke-width=20 stroke-dasharray="${l} ${251.33-l}" stroke-dashoffset="${-off}" transform="rotate(-90 60 60)"/>`;off+=l;return c}).join('');
h+=`<div class=card><b>Per categoria</b><div style="display:flex;align-items:center;gap:12px"><svg viewBox="0 0 120 120" width=130 height=130>${donut}<text x=60 y=64 text-anchor=middle font-size=12 fill=currentColor>${eur(t)}</text></svg><div style="flex:1">${cats.map(([k,v],i)=>`<div class=row style="padding:2px 0"><span><span style="color:${COL[i%COL.length]}">●</span> ${esc(k)}</span><span class=m>${Math.round(v/t*100)}% · ${eur(v)}</span></div>`).join('')}</div></div></div>`;
if(!P)h+=`<div class=card><b>Per persona</b>${whos.map(([k,v])=>`<div style="margin:8px 0"><div class=row style="padding:0"><span>${esc(k)}</span><span>${eur(v)} <span class=m>(${Math.round(v/t*100)}%)</span></span></div><div class=bar><i style="width:${v/t*100}%"></i></div></div>`).join('')}</div>`;
const ys=per==='cy'?cu.y:per==='y'?new Date().getFullYear():0,mo=(ys?[...Array(12)].map((_,i)=>ys+'-'+String(i+1).padStart(2,'0')):[-5,-4,-3,-2,-1,0].map(o=>ym(o))).map(k=>{return[k.slice(5)+'/'+k.slice(2,4),sum(of('expense').filter(r=>r.date.startsWith(k)&&(!P||(r.who||'Comune')===P)))]}),mx=Math.max(...mo.map(x=>x[1]),1);
h+=`<div class=card><b>${ys?'Mesi del '+ys:'Ultimi 6 mesi'}</b><div style="display:flex;align-items:flex-end;gap:8px;height:120px;margin-top:8px">${mo.map(([k,v])=>`<div style="flex:1;text-align:center"><div class=m style="font-size:10px">${Math.round(v)}</div><div style="background:var(--a);height:${v/mx*80}px;border-radius:4px 4px 0 0"></div><div class=m style="font-size:11px">${k}</div></div>`).join('')}</div></div>`;
const big=[...ex].sort((a,b)=>b.amount-a.amount)[0],nd=(()=>{if(per==='t')return 0;const[a,b]=range(),e=a>today()||b<today()?b:today();return Math.round((new Date(e+'T12:00')-new Date(a+'T12:00'))/864e5)+1})();
h+=`<div class=card><b>Dati</b><div class=row><span>Numero spese</span><b>${ex.length}</b></div><div class=row><span>Media per spesa</span><b>${eur(ex.length?t/ex.length:0)}</b></div>${nd?`<div class=row><span>Media al giorno</span><b>${eur(t/nd)}</b></div>`:''}<div class=row><span>Spesa più alta</span><b>${esc(big.title)} ${eur(big.amount)}</b></div></div>`;
return h}
const seg=()=>`<div class=card style="padding:6px"><div class=subtabs>${[['s','Spese'],['r','Risparmi']].map(([k,l])=>`<button class="${sv===k?'on':''}" onclick="sv='${k}';render()">${l}</button>`).join('')}</div></div>`;
function rec(t){
  const a=rows.filter(r=>r.type===t&&r.recurring);if(!a.length)return '';
  return `<details class="card accordion"><summary>${t==='expense'?'Spese ricorrenti attive':'Entrate ricorrenti attive'} · ${a.length}</summary>`+a.map(r=>`<div class=card><div class=row><div>${esc(r.title)} <b>${eur(r.amount)}</b><div class=m>prossima: ${fd(r.date)} · ${esc(r.who||'Comune')}</div></div><div><button class=s onclick="openForm('${r.type}','${r.id}')">✎</button><button class=s onclick="del('${r.id}')">✕</button></div></div></div>`).join('')+'</details>';
}
function savings(){
  const inc=pe('income'),ex=pe('expense'),T=sum(inc)-sum(ex),col=v=>v>=0?'var(--g)':'var(--r)';
  const ms=[...new Set([...inc,...ex].map(r=>r.date.slice(0,7)))].sort().reverse().slice(0,12);
  return periodSelector()+`<div class=card><div class=m>Risparmio · ${plabel()} (entrate − spese)</div><h2 style="margin:0;color:${col(T)}">${eur(T)}</h2><div class=m>Entrate ${eur(sum(inc))} · Spese ${eur(sum(ex))}</div></div><div class=card><b>Mese per mese</b>`+(ms.map(m=>{const a=sum(inc.filter(r=>r.date.startsWith(m))),b=sum(ex.filter(r=>r.date.startsWith(m)));return `<div class=row><span>${m.slice(5)}/${m.slice(0,4)}</span><span class=m>+${eur(a)} −${eur(b)}</span><b>${eur(a-b)}</b></div>`}).join('')||'<span class=m>Nessun dato</span>')+`</div>`+rec('income')+`<details class="card accordion"><summary>Tutte le entrate del periodo</summary>`+inc.slice(0,60).map(r=>`<div class=card><div class=row><div>${esc(r.title)}<div class=m>${fd(r.date)} · ${esc(r.who||'Comune')}${r.recurring?' · 🔁':''}</div></div><div><b>${eur(r.amount)}</b> <button class=s onclick="openForm('income','${r.id}')">✎</button><button class=s onclick="del('${r.id}')">✕</button></div></div></div>`).join('')+`</details>`;
}
function forecastPage(){
  const views=[['next','Prossimo mese'],['current','Anno in corso'],['nextYear','Prossimo anno']],active=forecastView;
  let h=`<div class=card><div class=subtabs>${views.map(([k,l])=>`<button class="${active===k?'on':''}" onclick="forecastView='${k}';render()">${l}</button>`).join('')}</div></div>`;
  const base=new Date(),months=[];
  if(active==='next')months.push(new Date(base.getFullYear(),base.getMonth()+1,1));
  if(active==='current')for(let i=0;i<12;i++)months.push(new Date(base.getFullYear(),i,1));
  if(active==='nextYear')for(let i=0;i<12;i++)months.push(new Date(base.getFullYear()+1,i,1));
  months.forEach(d=>h+=forecastMonth(d));return h;
}
function forecastMonth(d){
  const key=iso(d).slice(0,7),re=rows.filter(r=>r.type==='expense'&&r.recurring),ri=rows.filter(r=>r.type==='income'&&r.recurring),bills=rows.filter(r=>r.type==='bill'&&r.date.startsWith(key)&&!r.paid);
  const e=sum(re),i=sum(ri),b=sum(bills),balance=i-e-b,tips=[];
  if(e||b)tips.push(`Previsione spese: ${eur(e+b)} (${eur(e)} ricorrenti + ${eur(b)} di scadenze).`);
  if(balance<0)tips.push(`Le entrate ricorrenti previste non coprono le uscite: mancano circa ${eur(-balance)}.`);
  else if(i)tips.push(`Dopo le uscite ricorrenti e le scadenze resterebbero circa ${eur(balance)} prima delle altre spese.`);
  if(bills.length)tips.push(`Hai ${bills.length} scadenze da considerare per ${eur(b)}.`);
  if(!tips.length)tips.push('Nessuna previsione disponibile: aggiungi spese o entrate ricorrenti.');
  return `<div class="card forecast"><b>${d.toLocaleDateString('it-IT',{month:'long',year:'numeric'})}</b><div class=row><span>Spese ricorrenti</span><b>${eur(e)}</b></div><div class=row><span>Scadenze</span><b>${eur(b)}</b></div><div class=row><span>Entrate ricorrenti</span><b>${eur(i)}</b></div><div class=row><span>Saldo previsto</span><b style="color:${balance>=0?'var(--g)':'var(--r)'}">${eur(balance)}</b></div><div class="card tip">${tips.map(x=>`<div>💡 ${x}</div>`).join('')}</div></div>`;
}
async function recur(){let ch=false;
for(const r of rows.filter(x=>(x.type==='expense'||x.type==='income')&&x.recurring&&x.date<=today())){let c=r,n=0;
while(c&&c.date<=today()&&n++<24){const{data}=await sb.from('entries').update({recurring:false}).eq('id',c.id).eq('recurring',true).select();if(!data||!data.length)break;
const{data:nx}=await sb.from('entries').insert({type:c.type,title:c.title,amount:c.amount,category:c.category,who:c.who,date:addM(c.date),recurring:true}).select();ch=true;c=nx&&nx[0]}}
return ch}
function openForm(T,id){T=T||{spese:sv==='r'?'income':'expense',scadenze:'bill'}[tab]||'expense';
const r=id?rows.find(x=>x.id===id):{},x=T==='appointment',b=T==='bill',i=T==='income',e=T==='expense',W=['Comune','Simone','Valeria'];
const op=(a,v)=>a.map(o=>`<option${o===v?' selected':''}>${o}</option>`).join('');
dlg.innerHTML=`<h3>${id?'Modifica':'Nuova'} ${{expense:'spesa',income:'entrata',appointment:'appuntamento',bill:'scadenza'}[T]}</h3>`+
(i?`<div class=m>Motivazione</div><select id=f_c>${op(INC,r.category)}</select>`:`<input id=f_t placeholder=Descrizione value="${esc(r.title)}">`)+
(x?'':`<input id=f_a type=number step=0.01 inputmode=decimal placeholder="Importo €" value="${r.amount??''}">`)+
(e?`<select id=f_c>${op(CATS,r.category)}</select>`:'')+
(e||i?`<div class=m>${i?'Ricevuto da':'Speso da'}</div><select id=f_w>${op(W,r.who||'Comune')}</select>`:'')+
(b?`<div class=m>Chi paga</div><select id=f_p>${op(W,r.payer||'Comune')}</select><label><input id=f_l type=checkbox style="width:auto"${r.alt?' checked':''}> Alterna Simone/Valeria ogni mese</label>`:'')+
`<div class=m>Data</div><input id=f_d type=date value="${r.date||today()}">`+(x?`<input id=f_h type=time value="${r.time||''}">`:'')+
(x?'':`<label><input id=f_r type=checkbox style="width:auto"${r.recurring?' checked':''}> Ricorrente ogni mese</label>`)+
`<button class=b onclick="save('${T}','${id||''}')">Salva</button><button class=s onclick="dlg.close()">Annulla</button>`;dlg.showModal()}
async function save(T,id){const g=k=>window[k]?window[k].value:null,t=T==='income'?g('f_c'):(g('f_t')||'').trim();if(!t||!f_d.value)return;
const r={type:T,title:t,date:f_d.value,amount:window.f_a?parseFloat(f_a.value.replace(',','.'))||0:null,category:g('f_c'),who:g('f_w'),payer:g('f_p'),alt:!!(window.f_l&&f_l.checked),time:g('f_h')||null,recurring:!!(window.f_r&&f_r.checked)};
const{error}=await(id?sb.from('entries').update(r).eq('id',id):sb.from('entries').insert(r));if(error){alert('Errore nel salvataggio: '+error.message);return}dlg.close();load()}
async function del(id){if(confirm('Eliminare?')){await sb.from('entries').delete().eq('id',id);load()}}
async function pay(id){const r=rows.find(x=>x.id===id);await sb.from('entries').update({paid:true}).eq('id',id);
if(r.recurring){const o={Simone:'Valeria',Valeria:'Simone'};await sb.from('entries').insert({type:'bill',title:r.title,amount:r.amount,date:addM(r.date),recurring:true,alt:r.alt,payer:r.alt&&o[r.payer]?o[r.payer]:r.payer})}load()}
async function setBudget(){const v=parseFloat((prompt('Budget mensile €')||'').replace(',','.'));if(v>0){await sb.from('entries').insert({type:'budget',title:'Budget',amount:v,date:today()});load()}}
async function askNotif(){const r=await Notification.requestPermission();alert(r==='granted'?'Avvisi attivi: li vedrai all\'apertura dell\'app':'Permesso negato')}
init();
</script><dialog id=dlg></dialog></body></html>
