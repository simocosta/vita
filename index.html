<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Casa">
<link rel="manifest" href="manifest.webmanifest"><link rel="apple-touch-icon" href="icon-180.png"><title>Casa</title>
<style>
:root{--bg:#f5f5f7;--c:#fff;--t:#111;--m:#777;--a:#0a84ff;--r:#e5383b;--g:#2a9d4a}
@media(prefers-color-scheme:dark){:root{--bg:#000;--c:#1c1c1e;--t:#f2f2f2;--m:#999}}
*{box-sizing:border-box}body{margin:0;font:16px -apple-system,system-ui,sans-serif;background:var(--bg);color:var(--t);padding:env(safe-area-inset-top) 0 calc(90px + env(safe-area-inset-bottom))}
main{max-width:600px;margin:auto;padding:12px}.card{background:var(--c);border-radius:14px;padding:12px 14px;margin:8px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0}.m{color:var(--m);font-size:13px}
h2{margin:12px 4px 4px}nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--c);padding-bottom:env(safe-area-inset-bottom);border-top:1px solid #8883}
nav button{flex:1;border:0;background:none;padding:12px 0;font-size:13px;color:var(--m)}nav button.on{color:var(--a);font-weight:700}
.fab{position:fixed;right:18px;bottom:calc(70px + env(safe-area-inset-bottom));width:54px;height:54px;border-radius:27px;border:0;background:var(--a);color:#fff;font-size:30px}
input,select,button.b{width:100%;padding:11px;margin:5px 0;border-radius:10px;border:1px solid #8885;background:var(--c);color:var(--t);font-size:16px}
button.b{background:var(--a);color:#fff;border:0}button.s{border:0;background:#8882;color:var(--t);border-radius:8px;padding:6px 10px}
.warn{background:#e5383b22;color:var(--r)}.bar{height:8px;background:#8883;border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;background:var(--a)}
dialog{border:0;border-radius:16px;width:92%;max-width:420px;background:var(--c);color:var(--t)}
</style></head><body><main id="app"></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
const SB_URL='INCOLLA_PROJECT_URL',SB_KEY='INCOLLA_ANON_PUBLIC_KEY';
const sb=supabase.createClient(SB_URL,SB_KEY);
const CATS=['Casa','Spesa','Ristoranti','Trasporti','Salute','Svago','Abbonamenti','Altro'];
let rows=[],tab='spese';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>Number(n||0).toLocaleString('it-IT',{style:'currency',currency:'EUR'});
const iso=d=>new Date(d.getTime()-d.getTimezoneOffset()*6e4).toISOString().slice(0,10);
const today=()=>iso(new Date());
const fd=s=>new Date(s+'T12:00').toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'});
const days=s=>Math.round((new Date(s+'T12:00')-new Date(today()+'T12:00'))/864e5);
const ym=(o=0)=>{const d=new Date();d.setDate(1);d.setMonth(d.getMonth()+o);return iso(d).slice(0,7)};
const of=t=>rows.filter(r=>r.type===t);
const sum=a=>a.reduce((s,r)=>s+Number(r.amount||0),0);
const monthExp=m=>of('expense').filter(r=>r.date.startsWith(m));
const budget=()=>Number(of('budget').sort((a,b)=>b.created_at>a.created_at?1:-1)[0]?.amount||0);

async function init(){const{data}=await sb.auth.getSession();data.session?start():login()}
function login(msg=''){app.innerHTML=`<h2>Casa 🏠</h2><div class=card><input id=e type=email placeholder=Email autocomplete=username><input id=p type=password placeholder=Password autocomplete=current-password><button class=b onclick=doLogin()>Accedi</button><p class=m>${msg}</p></div>`}
async function doLogin(){const{error}=await sb.auth.signInWithPassword({email:e.value.trim(),password:p.value});error?login('Credenziali errate'):start()}
async function start(){await load();sb.channel('e').on('postgres_changes',{event:'*',schema:'public',table:'entries'},load).subscribe();
document.addEventListener('visibilitychange',()=>!document.hidden&&load());
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js')}
async function load(){const{data}=await sb.from('entries').select('*').order('date',{ascending:false});rows=data||[];render();push()}

function dueSoon(){return of('bill').filter(b=>!b.paid&&days(b.date)<=3).sort((a,b)=>a.date>b.date?1:-1)}
async function push(){const d=dueSoon();if(!d.length||!('Notification'in window)||Notification.permission!=='granted')return;
if(localStorage.ln===today())return;localStorage.ln=today();
const r=await navigator.serviceWorker.ready;r.showNotification('Pagamenti in scadenza',{body:d.map(b=>`${b.title} ${eur(b.amount)}`).join(', ')})}

function render(){
const tabs=[['spese','💶 Spese'],['agenda','📅 Agenda'],['scadenze','🔔 Scadenze'],['consigli','💡 Consigli']];
let h=dueSoon().map(b=>`<div class="card warn">⚠️ ${esc(b.title)} ${eur(b.amount)} – ${days(b.date)<0?'scaduta':days(b.date)==0?'oggi':'tra '+days(b.date)+' gg'}</div>`).join('');
if(tab==='spese'){const m=monthExp(ym()),t=sum(m),b=budget(),by={};m.forEach(r=>by[r.category]=(by[r.category]||0)+Number(r.amount));
h+=`<div class=card><div class=m>Speso questo mese</div><h2 style="margin:0">${eur(t)}</h2>${b?`<div class=bar><i style="width:${Math.min(100,t/b*100)}%"></i></div><div class=m>Budget ${eur(b)} · restano ${eur(b-t)}</div>`:''}<button class=s onclick=setBudget()>Imposta budget</button></div>
<div class=card>${Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([k,v])=>`<div class=row><span>${esc(k)}</span><b>${eur(v)}</b></div>`).join('')||'<span class=m>Nessuna spesa</span>'}</div><h2>Ultime spese</h2>`+
of('expense').slice(0,40).map(r=>`<div class=card><div class=row><div>${esc(r.title)}<div class=m>${fd(r.date)} · ${esc(r.category)} · ${esc((r.created_by||'').split('@')[0])}</div></div><div><b>${eur(r.amount)}</b> <button class=s onclick="del('${r.id}')">✕</button></div></div></div>`).join('')}
if(tab==='agenda'){h+='<h2>Prossimi appuntamenti</h2>'+(of('appointment').filter(r=>r.date>=today()).sort((a,b)=>(a.date+a.time)>(b.date+b.time)?1:-1).map(r=>`<div class=card><div class=row><div>${esc(r.title)}<div class=m>${fd(r.date)} ${esc(r.time||'')}</div></div><button class=s onclick="del('${r.id}')">✕</button></div></div>`).join('')||'<p class=m>Nessun appuntamento</p>')}
if(tab==='scadenze'){h+='<h2>Da pagare</h2>'+(of('bill').filter(r=>!r.paid).sort((a,b)=>a.date>b.date?1:-1).map(r=>`<div class=card><div class=row><div>${esc(r.title)} <b>${eur(r.amount)}</b><div class=m style="${days(r.date)<0?'color:var(--r)':''}">${fd(r.date)}${r.recurring?' · mensile':''}</div></div><div><button class=s onclick="pay('${r.id}')">Pagata</button> <button class=s onclick="del('${r.id}')">✕</button></div></div></div>`).join('')||'<p class=m>Nulla da pagare 🎉</p>')}
if(tab==='consigli')h+=`<h2>Suggerimenti</h2>`+advice().map(a=>`<div class=card>${a}</div>`).join('')+`<button class=b onclick=askNotif()>Attiva avvisi sul telefono</button><button class=s style="margin-top:8px" onclick="sb.auth.signOut().then(login)">Esci</button>`;
app.innerHTML=`<div id=top></div>${h}<button class=fab onclick=openForm()>+</button><nav>${tabs.map(([k,l])=>`<button class="${k===tab?'on':''}" onclick="tab='${k}';render()">${l}</button>`).join('')}</nav>`}

function advice(){const out=[],m=monthExp(ym()),p=monthExp(ym(-1)),t=sum(m),pt=sum(p),b=budget(),now=new Date();
const left=new Date(now.getFullYear(),now.getMonth()+1,0).getDate()-now.getDate();
if(pt&&t>pt*(now.getDate()/30)*1.3)out.push(`📈 Stai spendendo più del mese scorso (${eur(t)} contro ${eur(pt)} totali).`);
const cs=a=>a.reduce((o,r)=>(o[r.category]=(o[r.category]||0)+Number(r.amount),o),{}),c1=cs(m),c0=cs(p);
Object.keys(c1).forEach(k=>{if(c0[k]>50&&c1[k]>c0[k]*1.3)out.push(`⚠️ ${k}: già ${eur(c1[k])} (mese scorso ${eur(c0[k])}).`)});
if(b){const r=b-t;out.push(r>=0?`✅ Restano ${eur(r)} di budget: circa ${eur(r/Math.max(left,1))} al giorno.`:`🚨 Budget superato di ${eur(-r)}.`)}else out.push('Imposta un budget mensile per avere consigli più precisi.');
const soon=of('bill').filter(x=>!x.paid&&days(x.date)<=7&&days(x.date)>=0);if(soon.length)out.push(`🔔 Nei prossimi 7 giorni devi pagare ${eur(sum(soon))}: tieni da parte la cifra.`);
const top=Object.entries(c1).sort((a,b)=>b[1]-a[1])[0];if(top)out.push(`🏷️ Categoria più cara: ${top[0]} (${eur(top[1])}).`);
return out}

function openForm(){const T={spese:'expense',agenda:'appointment',scadenze:'bill'}[tab]||'expense';const x=T==='appointment';
dlg.innerHTML=`<h3>${{expense:'Nuova spesa',appointment:'Nuovo appuntamento',bill:'Nuova scadenza'}[T]}</h3><input id=f_t placeholder=Descrizione>${x?'':'<input id=f_a type=number step=0.01 inputmode=decimal placeholder="Importo €">'}${T==='expense'?`<select id=f_c>${CATS.map(c=>`<option>${c}</option>`).join('')}</select>`:''}<input id=f_d type=date value="${today()}">${x?'<input id=f_h type=time>':''}${T==='bill'?'<label><input id=f_r type=checkbox style="width:auto"> Ricorrente ogni mese</label>':''}<button class=b onclick="save('${T}')">Salva</button><button class=s onclick="dlg.close()">Annulla</button>`;dlg.showModal()}
async function save(T){const t=f_t.value.trim();if(!t||!f_d.value)return;
const r={type:T,title:t,date:f_d.value,amount:window.f_a?parseFloat(f_a.value.replace(',','.'))||0:null,category:window.f_c?f_c.value:null,time:window.f_h?f_h.value:null,recurring:!!(window.f_r&&f_r.checked)};
await sb.from('entries').insert(r);dlg.close();load()}
async function del(id){if(confirm('Eliminare?')){await sb.from('entries').delete().eq('id',id);load()}}
async function pay(id){const r=rows.find(x=>x.id===id);await sb.from('entries').update({paid:true}).eq('id',id);
if(r.recurring){const d=new Date(r.date+'T12:00');d.setMonth(d.getMonth()+1);await sb.from('entries').insert({type:'bill',title:r.title,amount:r.amount,date:iso(d),recurring:true})}load()}
async function setBudget(){const v=parseFloat((prompt('Budget mensile €')||'').replace(',','.'));if(v>0){await sb.from('entries').insert({type:'budget',title:'Budget',amount:v,date:today()});load()}}
async function askNotif(){const r=await Notification.requestPermission();alert(r==='granted'?'Avvisi attivi: li vedrai all\'apertura dell\'app':'Permesso negato')}
init();
</script><dialog id=dlg></dialog></body></html>
